name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'v1.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Validate input version
        shell: bash
        run: |
          if ! [[ "${{ inputs.tag_name }}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Allowed TAG format is vX.Y (e.g., v1.0)"
            exit 1
          fi

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.tag_name }}
          git push origin ${{ inputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        run: gh release create ${{ inputs.tag_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
